<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monopoly Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a472a, #2d5016); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; padding: 20px 0; margin-bottom: 20px; }
        h1 { font-size: 3rem; background: linear-gradient(45deg, #ffd700, #ffec8b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .game-container { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .board { display: grid; grid-template-columns: repeat(11, 60px); grid-template-rows: repeat(11, 60px); gap: 2px; background: #cde6d0; padding: 10px; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .space { background: #fff; border: 1px solid #333; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 0.65rem; text-align: center; position: relative; cursor: pointer; }
        .space.corner { background: #e8e8e8; font-weight: bold; }
        .space-header { width: 100%; height: 20%; border-radius: 3px 3px 0 0; margin-bottom: 2px; }
        .property-brown .space-header { background: #8B4513; }
        .property-lightblue .space-header { background: #87CEEB; }
        .property-pink .space-header { background: #FF69B4; }
        .property-orange .space-header { background: #FFA500; }
        .property-red .space-header { background: #FF0000; }
        .property-yellow .space-header { background: #FFD700; }
        .property-green .space-header { background: #008000; }
        .property-blue .space-header { background: #0000FF; }
        .property-railroad .space-header { background: #333; }
        .property-utility .space-header { background: #666; }
        .dice-area { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
        .dice { width: 60px; height: 60px; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #333; }
        .btn-roll { padding: 15px 40px; font-size: 1.2rem; background: linear-gradient(45deg, #ffd700, #ffec8b); color: #1a472a; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .sidebar { flex: 1; min-width: 350px; max-width: 450px; }
        .panel { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border-radius: 10px; padding: 20px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.2); }
        .panel h2 { font-size: 1.3rem; margin-bottom: 15px; color: #ffd700; border-bottom: 2px solid rgba(255,255,255,0.3); padding-bottom: 10px; }
        .player-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid; }
        .player-card.active { background: rgba(255,215,0,0.2); transform: scale(1.02); }
        .player-1 { border-color: #ff4444; }
        .player-2 { border-color: #44ff44; }
        .player-3 { border-color: #4444ff; }
        .player-4 { border-color: #ffff44; }
        .token { width: 20px; height: 20px; border-radius: 50%; position: absolute; border: 2px solid #fff; z-index: 5; }
        .token-1 { background: #ff4444; }
        .token-2 { background: #44ff44; }
        .token-3 { background: #4444ff; }
        .token-4 { background: #ffff44; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-buy { background: #4CAF50; color: white; }
        .btn-pass { background: #ff9800; color: white; }
        .message-log { max-height: 200px; overflow-y: auto; font-size: 0.9rem; }
        .log-entry { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: linear-gradient(135deg, #1a472a, #2d5016); padding: 40px; border-radius: 15px; text-align: center; border: 3px solid #ffd700; max-width: 500px; }
        .setup-form { display: flex; flex-direction: column; gap: 15px; }
        .setup-form input, .setup-form select { padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>🎩 MONOPOLY 🎩</h1><p>Classic Property Trading Game</p></header>
        <div class="game-container">
            <div class="board" id="board"></div>
            <div class="sidebar">
                <div class="panel">
                    <h2>🎲 Dice Roll</h2>
                    <div class="dice-area"><div class="dice" id="dice1">🎲</div><div class="dice" id="dice2">🎲</div></div>
                    <button class="btn-roll" id="btn-roll" onclick="rollDice()">Roll Dice</button>
                </div>
                <div class="panel"><h2>👥 Players</h2><div id="players-container"></div></div>
                <div class="panel">
                    <h2>🏠 Current Space</h2>
                    <div id="current-space-info"><p>Roll the dice to start!</p></div>
                    <div class="action-buttons" id="action-buttons" style="display:none;">
                        <button class="btn-action btn-buy" id="btn-buy" onclick="buyProperty()">Buy</button>
                        <button class="btn-action btn-pass" onclick="endTurn()">Pass</button>
                    </div>
                </div>
                <div class="panel"><h2>📜 Game Log</h2><div class="message-log" id="game-log"></div></div>
                <div class="panel"><button class="btn-action btn-buy" onclick="resetGame()" style="width:100%">New Game</button></div>
            </div>
        </div>
    </div>
    <div class="modal active" id="setup-modal">
        <div class="modal-content">
            <h2>🎩 Game Setup</h2>
            <div class="setup-form">
                <label>Number of Players:</label>
                <select id="num-players" onchange="updatePlayerNamesInput()">
                    <option value="2">2 Players</option>
                    <option value="3">3 Players</option>
                    <option value="4" selected>4 Players</option>
                </select>
                <div id="player-names"></div>
                <button class="btn-roll" onclick="startGame()">Start Game</button>
            </div>
        </div>
    </div>
    <div class="modal" id="gameover-modal">
        <div class="modal-content">
            <h2>🏆 Game Over!</h2>
            <p id="winner-text"></p>
            <button class="btn-roll" onclick="resetGame()">Play Again</button>
        </div>
    </div>
    <script>
        let players=[],currentPlayerIndex=0,gameStarted=false,doublesCount=0,inJail=false,jailTurns=0;
        const spaces=[
            {name:"GO",type:"corner",price:0},{name:"Mediterranean Ave",type:"property",group:"brown",price:60,rent:[2,10,30,90,160,250]},
            {name:"Community Chest",type:"chest",price:0},{name:"Baltic Ave",type:"property",group:"brown",price:60,rent:[4,20,60,180,320,450]},
            {name:"Income Tax",type:"tax",price:0,tax:200},{name:"Reading RR",type:"railroad",group:"railroad",price:200,rent:[25,50,100,200]},
            {name:"Oriental Ave",type:"property",group:"lightblue",price:100,rent:[6,30,90,270,400,550]},{name:"Chance",type:"chance",price:0},
            {name:"Vermont Ave",type:"property",group:"lightblue",price:100,rent:[6,30,90,270,400,550]},{name:"Connecticut Ave",type:"property",group:"lightblue",price:120,rent:[8,40,100,300,450,600]},
            {name:"Jail",type:"corner",price:0},{name:"St. Charles Place",type:"property",group:"pink",price:140,rent:[10,50,150,450,625,750]},
            {name:"Electric Company",type:"utility",group:"utility",price:150},{name:"States Ave",type:"property",group:"pink",price:140,rent:[10,50,150,450,625,750]},
            {name:"Virginia Ave",type:"property",group:"pink",price:160,rent:[12,60,180,500,700,900]},{name:"Pennsylvania RR",type:"railroad",group:"railroad",price:200,rent:[25,50,100,200]},
            {name:"St. James Place",type:"property",group:"orange",price:180,rent:[14,70,200,550,750,950]},{name:"Community Chest",type:"chest",price:0},
            {name:"Tennessee Ave",type:"property",group:"orange",price:180,rent:[14,70,200,550,750,950]},{name:"New York Ave",type:"property",group:"orange",price:200,rent:[16,80,220,600,800,1000]},
            {name:"Free Parking",type:"corner",price:0},{name:"Kentucky Ave",type:"property",group:"red",price:220,rent:[18,90,250,700,875,1050]},
            {name:"Chance",type:"chance",price:0},{name:"Indiana Ave",type:"property",group:"red",price:220,rent:[18,90,250,700,875,1050]},
            {name:"Illinois Ave",type:"property",group:"red",price:240,rent:[20,100,300,750,925,1100]},{name:"B. & O. Railroad",type:"railroad",group:"railroad",price:200,rent:[25,50,100,200]},
            {name:"Atlantic Ave",type:"property",group:"yellow",price:260,rent:[22,110,330,800,975,1150]},{name:"Ventnor Ave",type:"property",group:"yellow",price:260,rent:[22,110,330,800,975,1150]},
            {name:"Water Works",type:"utility",group:"utility",price:150},{name:"Marvin Gardens",type:"property",group:"yellow",price:280,rent:[24,120,360,850,1025,1200]},
            {name:"Go To Jail",type:"corner",price:0},{name:"Pacific Ave",type:"property",group:"green",price:300,rent:[26,130,390,900,1100,1275]},
            {name:"North Carolina Ave",type:"property",group:"green",price:300,rent:[26,130,390,900,1100,1275]},{name:"Community Chest",type:"chest",price:0},
            {name:"Pennsylvania Ave",type:"property",group:"green",price:320,rent:[28,150,450,1000,1200,1400]},{name:"Short Line",type:"railroad",group:"railroad",price:200,rent:[25,50,100,200]},
            {name:"Chance",type:"chance",price:0},{name:"Park Place",type:"property",group:"blue",price:350,rent:[35,175,500,1100,1300,1500]},
            {name:"Luxury Tax",type:"tax",price:0,tax:100},{name:"Boardwalk",type:"property",group:"blue",price:400,rent:[50,200,600,1400,1700,2000]}
        ];
        let propertyState=spaces.map(()=>({owner:null,houses:0,hotel:false}));
        function updatePlayerNamesInput(){const n=document.getElementById('num-players').value,c=document.getElementById('player-names');c.innerHTML='';for(let i=0;i<n;i++)c.innerHTML+=`<label>Player ${i+1}:</label><input type="text" id="player-${i}-name" value="Player ${i+1}">`;}
        updatePlayerNamesInput();
        function createBoard(){const b=document.getElementById('board');b.innerHTML='';const pos=[[11,2],[11,3],[11,4],[11,5],[11,6],[11,7],[11,8],[11,9],[11,10],[10,11],[9,11],[8,11],[7,11],[6,11],[5,11],[4,11],[3,11],[2,11],[1,10],[1,9],[1,8],[1,7],[1,6],[1,5],[1,4],[1,3],[1,2],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[10,1]];const corners=[{pos:[11,1],name:"GO"},{pos:[1,11],name:"Jail"},{pos:[1,1],name:"Free Parking"},{pos:[11,11],name:"Go To Jail"}];corners.forEach((c,i)=>{const s=document.createElement('div');s.className='space corner';s.style.gridColumn=c.pos[1];s.style.gridRow=c.pos[0];s.textContent=c.name;s.dataset.index=i*10;b.appendChild(s);});spaces.forEach((s,i)=>{if(i%10===0)return;const el=document.createElement('div'),pi=i<10?i:i<20?i-1:i<30?i-2:i-3,p=pos[pi];el.className=`space property-${s.group||''}`;el.style.gridColumn=p[1];el.style.gridRow=p[0];el.dataset.index=i;el.innerHTML=(s.group?'<div class="space-header"></div>':'')+`<div class="space-name">${s.name}</div>`+(s.price>0?`<div class="space-price">$${s.price}</div>`:'');el.onclick=()=>showSpaceDetails(i);b.appendChild(el);});}
        function startGame(){const n=parseInt(document.getElementById('num-players').value),colors=['#ff4444','#44ff44','#4444ff','#ffff44'];players=[];for(let i=0;i<n;i++){const nm=document.getElementById(`player-${i}-name`).value||`Player ${i+1}`;players.push({name:nm,money:1500,position:0,properties:[],color:colors[i],bankrupt:false});}currentPlayerIndex=0;gameStarted=true;doublesCount=0;inJail=false;jailTurns=0;document.getElementById('setup-modal').classList.remove('active');createBoard();updatePlayerDisplay();addLog("🎩 Welcome to Monopoly!");addLog(`🎲 ${players[0].name}'s turn!`);placeTokens();}
        function placeTokens(){document.querySelectorAll('.token').forEach(t=>t.remove());players.forEach((p,i)=>{if(p.bankrupt)return;const el=document.querySelector(`[data-index="${p.position}"]`);if(el){const t=document.createElement('div');t.className=`token token-${i+1}`;t.style.left=`${10+i*15}%`;t.style.top=`${10+i*15}%`;el.appendChild(t);}});}
        function rollDice(){if(!gameStarted)return;document.getElementById('btn-roll').disabled=true;const d1=document.getElementById('dice1'),d2=document.getElementById('dice2');setTimeout(()=>{const r1=Math.floor(Math.random()*6)+1,r2=Math.floor(Math.random()*6)+1;d1.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r1-1];d2.textContent=['⚀','⚁','⚂','⚃','⚄','⚅'][r2-1];const total=r1+r2,isDouble=r1===r2;addLog(`🎲 ${players[currentPlayerIndex].name} rolled ${r1}+${r2}=${total}${isDouble?' (DOUBLES!)':''}`);if(inJail)handleJail(isDouble);else movePlayer(total,isDouble);},500);}
        function handleJail(isDouble){const p=players[currentPlayerIndex];if(isDouble){addLog("🎉 Free from Jail!");inJail=false;jailTurns=0;movePlayer(Math.floor(Math.random()*12)+2,false);}else{jailTurns++;if(jailTurns>=3){addLog("⛓️ Paid $50");p.money-=50;inJail=false;jailTurns=0;movePlayer(Math.floor(Math.random()*12)+2,false);}else{addLog("🔒 Still in Jail...");endTurn();}}updatePlayerDisplay();}
        function movePlayer(steps,isDouble){const p=players[currentPlayerIndex],old=p.position;p.position=(p.position+steps)%40;if(p.position<old){addLog("💰 Passed GO! +$200");p.money+=200;}placeTokens();updatePlayerDisplay();if(isDouble){doublesCount++;if(doublesCount>=3){addLog("😱 Three doubles! Go to Jail!");goToJail();return;}}else doublesCount=0;handleSpace(p.position);}
        function goToJail(){const p=players[currentPlayerIndex];p.position=10;inJail=true;doublesCount=0;placeTokens();addLog("🔒 Go to Jail!");endTurn();}
        function handleSpace(i){const p=players[currentPlayerIndex],s=spaces[i],st=propertyState[i];addLog(`📍 ${s.name}`);switch(s.type){case'property':case'railroad':case'utility':if(st.owner===null){if(p.money>=s.price)showBuyOption(s);else{addLog("💸 Can't afford");endTurn();}}else if(st.owner!==currentPlayerIndex)payRent(i);else{addLog("🏠 Your property");endTurn();}break;case'tax':addLog(`💸 Pay $${s.tax}`);p.money-=s.tax;updatePlayerDisplay();endTurn();break;case'chance':case'chest':drawCard(s.type);break;case'corner':if(s.name==="Go To Jail")goToJail();else endTurn();break;default:endTurn();}}
        function showBuyOption(s){document.getElementById('btn-buy').textContent=`Buy $${s.price}`;document.getElementById('action-buttons').style.display='flex';document.getElementById('btn-roll').disabled=true;}
        function buyProperty(){const p=players[currentPlayerIndex],s=spaces[p.position],st=propertyState[p.position];if(p.money>=s.price&&st.owner===null){p.money-=s.price;st.owner=currentPlayerIndex;p.properties.push(p.position);addLog(`🏠 Bought ${s.name}!`);updatePlayerDisplay();hideActionButtons();endTurn();}}
        function payRent(i){const p=players[currentPlayerIndex],s=spaces[i],st=propertyState[i],o=players[st.owner];let rent=0;if(s.type==='property')rent=s.rent[st.hotel?5:st.houses];else if(s.type==='railroad'){const c=o.properties.filter(x=>spaces[x].type==='railroad').length;rent=s.rent[c-1];}else if(s.type==='utility')rent=Math.floor(s.price*0.1);if(rent>0){addLog(`💰 Pay $${rent} to ${o.name}`);p.money-=rent;o.money+=rent;updatePlayerDisplay();checkBankruptcy(p);}endTurn();}
        function drawCard(type){const cards={chance:[{t:"Advance to GO",a:()=>{players[currentPlayerIndex].position=0;players[currentPlayerIndex].money+=200;placeTokens();}},{t:"+$50",a:()=>players[currentPlayerIndex].money+=50},{t:"-$15",a:()=>players[currentPlayerIndex].money-=15}],chest:[{t:"Advance to GO",a:()=>{players[currentPlayerIndex].position=0;players[currentPlayerIndex].money+=200;placeTokens();}},{t:"+$200",a:()=>players[currentPlayerIndex].money+=200},{t:"-$50",a:()=>players[currentPlayerIndex].money-=50}]};const c=cards[type][Math.floor(Math.random()*cards[type].length)];addLog(`🃏 ${type}: ${c.t}`);c.a();updatePlayerDisplay();endTurn();}
        function hideActionButtons(){document.getElementById('action-buttons').style.display='none';}
        function endTurn(){hideActionButtons();const active=players.filter(p=>!p.bankrupt);if(active.length===1){gameOver(active[0]);return;}do{currentPlayerIndex=(currentPlayerIndex+1)%players.length;}while(players[currentPlayerIndex].bankrupt);doublesCount=0;document.getElementById('btn-roll').disabled=false;addLog(`\n🎲 ${players[currentPlayerIndex].name}'s turn!`);updatePlayerDisplay();}
        function checkBankruptcy(p){if(p.money<0){addLog(`💀 ${p.name} BANKRUPT!`);p.bankrupt=true;p.properties.forEach(i=>{propertyState[i].owner=null;propertyState[i].houses=0;});p.properties=[];placeTokens();}}
        function gameOver(w){document.getElementById('winner-text').textContent=`🏆 ${w.name} wins with $${w.money}!`;document.getElementById('gameover-modal').classList.add('active');gameStarted=false;}
        function resetGame(){document.getElementById('gameover-modal').classList.remove('active');document.getElementById('setup-modal').classList.add('active');propertyState=spaces.map(()=>({owner:null,houses:0,hotel:false}));document.getElementById('game-log').innerHTML='';hideActionButtons();}
        function updatePlayerDisplay(){const c=document.getElementById('players-container');c.innerHTML='';players.forEach((p,i)=>{const card=document.createElement('div');card.className=`player-card player-${i+1}${i===currentPlayerIndex&&gameStarted?' active':''}`;card.style.opacity=p.bankrupt?'0.5':'1';card.innerHTML=`<div style="color:${p.color}">${p.name}${p.bankrupt?' 💀':''}</div><div>💵 $${p.money}</div><div>🏠 ${p.properties.length}</div>`;c.appendChild(card);});if(gameStarted){const p=players[currentPlayerIndex],s=spaces[p.position],st=propertyState[p.position];let info=`<strong>${s.name}</strong><br>`;if(s.price>0){info+=`$${s.price}<br>`;if(st.owner!==null)info+=`Owner: ${players[st.owner].name}<br>`;}document.getElementById('current-space-info').innerHTML=info;}}
        function showSpaceDetails(i){const s=spaces[i],st=propertyState[i];let d=`<strong>${s.name}</strong><br>`;if(s.price>0)d+=`$${s.price}<br>`;if(st.owner!==null)d+=`Owner: ${players[st.owner]?.name||'?'}<br>`;else d+=`Available<br>`;addLog(`📋 ${d}`);}
        function addLog(m){const l=document.getElementById('game-log'),e=document.createElement('div');e.className='log-entry';e.textContent=m;l.insertBefore(e,l.firstChild);}
        createBoard();
    </script>
</body>
</html>
